<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CD Cayón · ERP del Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --yellow:#F4C10F;
  --yellow-deep:#D9A700;
  --black:#141210;
  --black-soft:#211d18;
  --cream:#FAF7EE;
  --paper:#FFFFFF;
  --ink:#1b1710;
  --ink-soft:#5c5546;
  --line:#E7DFC8;
  --green:#256B34;
  --green-bg:#E7F3E6;
  --red:#B3261E;
  --red-bg:#FBE9E7;
  --amber:#8A5B00;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --cream:#141210;
    --paper:#1c1912;
    --ink:#F3EEDD;
    --ink-soft:#C9C0A6;
    --line:#3a3426;
    --green-bg:#173322;
    --red-bg:#3a1a17;
  }
}
:root[data-theme="dark"]{
  --cream:#141210;
  --paper:#1c1912;
  --ink:#F3EEDD;
  --ink-soft:#C9C0A6;
  --line:#3a3426;
  --green-bg:#173322;
  --red-bg:#3a1a17;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.stat-num,nav .nav-label,.section-title{font-family:'Oswald',system-ui,sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:250px;flex-shrink:0;
  background:linear-gradient(180deg,var(--black) 0%, var(--black-soft) 100%);
  color:#f4efdd;
  display:flex;flex-direction:column;
  padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px));
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:2px solid rgba(244,193,15,.35);margin-bottom:14px;}
.brand img{width:46px;height:46px;border-radius:50%;background:#000;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text .name{font-size:17px;font-weight:600;color:var(--yellow);letter-spacing:.3px;}
.brand-text .sub{font-size:11px;color:#c9c2a8;font-family:'Inter';}

nav{display:flex;flex-direction:column;gap:3px;}
nav button{
  display:flex;align-items:center;gap:11px;
  background:transparent;border:none;color:#efe9d6;
  padding:11px 12px;border-radius:8px;cursor:pointer;
  font-size:14.5px;text-align:left;transition:background .15s ease, color .15s ease;
}
nav button .ic{font-size:17px;width:22px;text-align:center;}
nav button:hover{background:rgba(244,193,15,.12);}
nav button.active{background:var(--yellow);color:#171304;font-weight:600;}
nav button.active .ic{filter:none;}

.sidebar-foot{margin-top:auto;padding-top:16px;font-size:11px;color:#8f886f;border-top:1px solid rgba(255,255,255,.08);}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 26px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:5;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.2px;}
.topbar .crumb{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-family:'Inter';}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}
.save-indicator{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--green);padding:0 4px;transition:color .2s ease;}
.sync-indicator{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;}
.sync-indicator.sync-local{color:var(--ink-soft);background:var(--cream);border:1px solid var(--line);}
.sync-indicator.sync-shared{color:var(--green);background:var(--green-bg);border:1px solid var(--green);}
@keyframes savePulse{ 0%{ transform:scale(1.18); color:var(--yellow-deep); } 100%{ transform:scale(1); color:var(--green); } }
.save-indicator.save-pulse{ animation:savePulse .5s ease; }

.btn{
  display:inline-flex;align-items:center;gap:7px;
  border-radius:8px;border:1.5px solid var(--line);background:var(--paper);
  color:var(--ink);padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{background:var(--cream);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--yellow);border-color:var(--yellow-deep);color:#171304;}
.btn-primary:hover{background:var(--yellow-deep);}
.btn-dark{background:var(--black);border-color:var(--black);color:var(--yellow);}
.btn-dark:hover{background:var(--black-soft);}
.btn-danger{color:var(--red);border-color:var(--red);background:transparent;}
.btn-danger:hover{background:var(--red-bg);}
.btn:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2.5px solid var(--yellow-deep);outline-offset:1px;}

.content{padding:24px 26px 70px;flex:1;}

/* ---------- DASHBOARD ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;border-left:5px solid var(--yellow);
}
.kpi .stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-family:'Inter';}
.kpi .stat-num{font-size:28px;font-weight:600;margin-top:4px;}
.kpi.neg{border-left-color:var(--red);}
.kpi.pos{border-left-color:var(--green);}

.chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px;}
.chart-grid.thirds{grid-template-columns:1fr 1fr;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.card h3{margin:0 0 12px;font-size:15.5px;font-weight:600;}
.card .chart-wrap{position:relative;height:260px;}
@media(max-width:980px){.chart-grid,.chart-grid.thirds{grid-template-columns:1fr;}}

/* ---------- SECTION HEADER ---------- */
.section-title{font-size:20px;font-weight:600;margin:0 0 3px;}
.section-desc{font-size:13px;color:var(--ink-soft);margin:0 0 16px;font-family:'Inter';}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
.toolbar .left-tools,.toolbar .right-tools{display:flex;gap:8px;flex-wrap:wrap;}
.search-box{position:relative;}
.search-box input{padding:9px 12px 9px 32px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:13.5px;min-width:190px;}
.search-box::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6;}
.file-hidden{display:none;}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;}
thead th{
  background:var(--black);color:var(--yellow);
  text-align:left;padding:11px 10px;font-weight:600;font-size:12.5px;
  position:sticky;top:0;white-space:nowrap;letter-spacing:.2px;
}
thead th.chk-col{width:36px;}
tbody td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:var(--cream);}
tbody tr.selected{background:var(--green-bg);}
tfoot td{padding:10px 8px;font-weight:700;background:var(--cream);border-top:2px solid var(--line);}

.cell-input,.cell-select{
  width:100%;border:1.5px solid transparent;border-bottom:1.5px dashed var(--line);
  background:transparent;color:var(--ink);cursor:text;
  padding:6px 7px;border-radius:6px 6px 0 0;font-size:13.5px;font-family:'Inter';min-width:80px;
}
select.cell-select{cursor:pointer;}
.cell-input:hover,.cell-select:hover{border-color:var(--yellow-deep);background:var(--cream);}
.cell-input:focus,.cell-select:focus{border:1.5px solid var(--yellow-deep);border-radius:6px;background:var(--paper);outline:none;}
.cell-input.num{text-align:right;}
tr .row-check{width:16px;height:16px;accent-color:var(--yellow-deep);cursor:pointer;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.tag.ok{background:var(--green-bg);color:var(--green);}
.tag.bad{background:var(--red-bg);color:var(--red);}
.tag.neutral{background:#EFE7CB;color:var(--amber);}
.diff-pos{color:var(--green);font-weight:700;}
.diff-neg{color:var(--red);font-weight:700;}
.row-actions{display:flex;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px;border-radius:6px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--red-bg);color:var(--red);}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .e-ic{font-size:34px;margin-bottom:8px;}

/* ---------- listado de socios en mayúsculas ---------- */
.table-upper thead th,
.table-upper tbody td,
.table-upper .cell-input,
.table-upper .cell-select,
.table-upper .cell-select option{ text-transform:uppercase; }

/* ---------- estado de pago: select + aviso de forma de pago ---------- */
.estado-cell{display:flex;align-items:center;gap:6px;}
.estado-cell .cell-select{min-width:0;}
.pay-info-btn{
  flex:0 0 auto;border:none;border-radius:6px;width:26px;height:26px;
  background:var(--green-bg);color:var(--green);cursor:pointer;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;
}
.pay-info-btn:hover{filter:brightness(.95);}

/* ---------- modal genérico ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,18,16,.55);
  display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;
}
.modal-box{
  background:var(--paper);color:var(--ink);border-radius:12px;padding:22px;
  max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);
}
.modal-box h3{margin:0 0 6px;font-size:17px;}
.modal-box select{
  width:100%;padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:'Inter';font-size:14px;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

.footer-note{font-size:12px;color:var(--ink-soft);margin-top:10px;}

/* ---------- CUENTAS (saldos) PANEL ---------- */
.cuentas-panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
.cuentas-head{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;}
.cuentas-head h3{margin:0;font-size:15.5px;font-weight:600;}
.cuentas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.cuenta-card{border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:9px;padding:12px 14px;background:var(--cream);}
.cuenta-name{font-weight:700;font-size:13.5px;margin-bottom:6px;}
.cuenta-inicial{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);gap:6px;margin-bottom:6px;}
.cuenta-inicial input{width:90px;text-align:right;border:1.5px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--paper);color:var(--ink);}
.cuenta-mov{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
.cuenta-saldo{font-size:19px;font-weight:700;}

/* ---------- TAQUILLA (jornada cards, vertical) ---------- */
.jornada-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.jornada-head{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;padding-bottom:12px;border-bottom:2px solid var(--yellow);margin-bottom:4px;}
.jornada-head label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-soft);font-weight:600;gap:3px;}
.jornada-head input{min-width:130px;border:1.5px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--cream);color:var(--ink);}
.jornada-head .delete-jornada{margin-left:auto;font-size:18px;align-self:center;}
.jornada-section{padding:12px 0;border-top:1px dashed var(--line);}
.jornada-section h4{margin:0 0 8px;font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.4px;font-family:'Inter';font-weight:700;}
.range-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:5px 0;}
.range-row .rr-label{font-size:13px;font-weight:600;min-width:120px;}
.range-row label{display:flex;flex-direction:column;font-size:10.5px;color:var(--ink-soft);gap:3px;}
.range-row input,.range-row select{width:118px;border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--cream);color:var(--ink);font-size:13px;}
.range-row .rr-sub{margin-left:auto;font-weight:700;color:var(--green);background:var(--green-bg);padding:6px 12px;border-radius:7px;font-size:13px;min-width:90px;text-align:center;}
.jornada-total{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding-top:14px;margin-top:6px;border-top:2px solid var(--ink);}
.jornada-total .tot-label{font-size:14px;font-weight:600;color:var(--ink-soft);}
.jornada-total b{font-size:21px;color:#171304;background:var(--yellow);padding:7px 16px;border-radius:8px;}
@media print{ .delete-jornada{display:none !important;} .jornada-head input,.range-row input,.range-row select{border:none !important;} }

/* ---------- AJUSTES ---------- */
.ajustes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.ajuste-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.ajuste-card.ajuste-main{border-left:5px solid var(--yellow);}
.ajuste-card h4{margin:0 0 10px;font-size:13px;font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:26px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:5px 5px 5px 12px;font-size:12px;}
.chip-del{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:14px;border-radius:50%;width:19px;height:19px;line-height:1;padding:0;}
.chip-del:hover{background:var(--red-bg);color:var(--red);}
.ajuste-add-row{display:flex;gap:8px;}
.ajuste-add-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--cream);color:var(--ink);font-size:12.5px;}
.ajuste-add-row .btn{padding:8px 12px;font-size:12.5px;white-space:nowrap;}

/* ---------- LOGIN GATE ---------- */
.login-gate{position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,var(--black) 0%, var(--black-soft) 60%, #2a2416 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--paper);border-radius:16px;padding:36px 30px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
.login-card img{width:72px;height:72px;border-radius:50%;margin-bottom:12px;background:#000;}
.login-card h2{margin:0 0 4px;font-size:20px;color:var(--ink);letter-spacing:.5px;}
.login-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;}
.login-card label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:14px;}
.login-card input{width:100%;margin-top:5px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);font-size:14px;}
.login-error{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px;font-weight:600;}

/* ---------- USERS LIST (Ajustes) ---------- */
.users-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.user-row{display:flex;gap:8px;align-items:center;}
.user-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--cream);color:var(--ink);font-size:13px;}

/* ---------- SUBTABS (Listado / Cuotas mensuales) ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--line);}
.subtab-btn{background:none;border:none;padding:10px 6px;margin-bottom:-2px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;}
.subtab-btn:hover{color:var(--ink);}
.subtab-btn.active{color:var(--ink);border-bottom-color:var(--yellow);}

/* ---------- FILTER SELECTS ---------- */
.filter-select{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.filter-select:hover{background:var(--cream);}

/* ---------- CUOTAS MENSUALES GRID ---------- */
.cuotas-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.cuotas-year{font-weight:700;font-size:16px;min-width:44px;text-align:center;}
.cuotas-table{min-width:820px;}
.cuotas-table th,.cuotas-table td{text-align:center;}
.cuotas-table thead th:first-child,.cuotas-table thead th:nth-child(2){text-align:left;}
.cuota-cell{padding:2px !important;}
.cuota-check{width:19px;height:19px;accent-color:var(--green);cursor:pointer;}

/* toast */
#toast{position:fixed;bottom:22px;right:22px;background:var(--black);color:var(--yellow);padding:12px 18px;border-radius:9px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:all .25s ease;z-index:200;pointer-events:none;}
#toast.show{opacity:1;transform:translateY(0);}

/* mobile */
.hamburger{display:none;background:var(--black);color:var(--yellow);border:none;border-radius:8px;padding:9px 11px;font-size:16px;cursor:pointer;}
@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.4);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:inline-flex;}
  .content{padding:18px 14px 60px;}
  .topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .kpi .stat-num{font-size:22px;}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;}
.scrim.show{display:block;}

/* ---------- PRINT ---------- */
@media print{
  .sidebar,.topbar .top-actions,.toolbar,.hamburger,#toast,.row-actions,.chk-col,td:last-child.actions-col,.subtabs{display:none !important;}
  body{background:#fff;}
  .app{display:block;}
  .content{padding:0;}
  .topbar{position:static;border:none;padding:0 0 14px;}
  .topbar h1{font-size:26px;}
  .card,.table-wrap{border:1px solid #999;box-shadow:none;}
  table{font-size:13px;}
  thead th{background:#111 !important;color:#F4C10F !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cell-input,.cell-select{border:none !important;}
  .kpi{break-inside:avoid;}
  .chart-grid{break-inside:avoid;}
}
body.print-fullscreen{background:#fff;}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="app">

function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), wait); };
}
function flashSaved(){
  const el = document.getElementById("saveIndicator");
  if(!el) return;
  el.textContent = "✓ Guardado";
  el.classList.remove("save-pulse");
  void el.offsetWidth;
  el.classList.add("save-pulse");
}

   this artifact) when available, and falls back to this browser's localStorage otherwise ---- */

function loadData(modId, seed){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+modId);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("storage read failed", e); }
  return JSON.parse(JSON.stringify(seed||[]));
}
function saveData(modId, arr){
  flashSaved();
  if(dbNS && dbDocs[modId]){
    dbDocs[modId].set({rows: arr}).catch(e=> console.warn("db save failed", modId, e));
  } else {
    try{ localStorage.setItem(STORAGE_PREFIX+modId, JSON.stringify(arr)); }
    catch(e){ console.warn("storage write failed", e); toast("No se pudo guardar (almacenamiento no disponible)"); }
  }
}
function loadSettingsLocal(){
  try{ const raw = localStorage.getItem(STORAGE_PREFIX+"settings"); if(raw) Object.assign(settingsStore, JSON.parse(raw)); }catch(e){}
}
const persistSettingsLocal = debounce(()=>{
  try{ localStorage.setItem(STORAGE_PREFIX+"settings", JSON.stringify(settingsStore)); }catch(e){}
}, 300);
const persistSettingsDb = debounce(()=>{
  if(dbNS && dbDocs.settings) dbDocs.settings.set(settingsStore).catch(e=> console.warn("settings save failed", e));
}, 400);
function persistSettings(){
  flashSaved();
  if(dbNS && dbDocs.settings) persistSettingsDb(); else persistSettingsLocal();
}

/* editable option lists (select + combo columns): stored in settingsStore, synced like everything else,
   so accounts / categories / payment methods etc. can be added AND removed from Ajustes on any device */
/* columnas con optionsByTipo (p.ej. "categoria" en contabilidad) tienen una lista de opciones
   distinta según el "tipo" de la fila (Ingreso / Gasto); se guardan por separado en settingsStore
   para poder añadir/quitar cuentas de Ingresos sin tocar las de Gastos, y viceversa */
function optionListKey(modId, col, tipo){
  return modId+"_"+col.key+(col.optionsByTipo ? "_"+(tipo||col.tipoFixed||"Ingreso") : "");
}
function getOptionsList(modId, col, tipo){
  if(modId==="traspasos" && (col.key==="cuentaOrigen" || col.key==="cuentaDestino")){
    modId = "contabilidad"; col = {key:"cuenta"};
  }
  const k = optionListKey(modId, col, tipo);
  if(settingsStore.optionLists[k]) return settingsStore.optionLists[k];
  if(col.optionsByTipo) return [...(col.optionsByTipo[tipo||col.tipoFixed||"Ingreso"]||[])];
  return [...(col.options||contabilidadCuentaFallback())];
}
function contabilidadCuentaFallback(){
  const c = MODULES.find(m=>m.id==="contabilidad").columns.find(c=>c.key==="cuenta");
  return c ? c.options : [];
}
function saveOptionsList(modId, col, list, tipo){
  settingsStore.optionLists[optionListKey(modId, col, tipo)] = list;
  persistSettings();
}
function addOption(modId, col, value, tipo){
  value = (value||"").trim();
  if(!value) return false;
  const list = getOptionsList(modId,col,tipo);
  if(list.includes(value)) return false;
  list.push(value);
  saveOptionsList(modId,col,list,tipo);
  return true;
}
function deleteOption(modId, col, value, tipo){
  let list = getOptionsList(modId,col,tipo);
  if(list.length<=1) { toast("Tiene que quedar al menos una opción"); return false; }
  list = list.filter(v=>v!==value);
  saveOptionsList(modId,col,list,tipo);
  return true;
}
/* si alguien ha ido quitando opciones desde Ajustes y la lista se ha quedado corta
   (p.ej. solo "Por competiciones (taquilla)" en Categoría · Ingresos), este botón
   borra la lista guardada a medida y hace que vuelva a usarse la lista completa
   de fábrica (CATEGORIAS_INGRESO / CATEGORIAS_GASTO, etc.) sin tocar los movimientos ya guardados */
function hasCustomOptionsList(modId, col, tipo){
  return Object.prototype.hasOwnProperty.call(settingsStore.optionLists, optionListKey(modId, col, tipo));
}
function resetOptionsList(modId, col, tipo){
  delete settingsStore.optionLists[optionListKey(modId, col, tipo)];
  persistSettings();
}

function getComboOptions(modId, col){ return getOptionsList(modId, col); }

/* ---- computed cell values (formulas) ---- */
const IVA_RATES = {"21%":0.21, "10%":0.10, "Exento":0};
function computedValue(mod, row, col){
  if(col.type==="computed-diff"){
    return Number(row.presupuestado||0) - Number(row.gastado||0);
  }
  if(col.type==="range-income"){
    const from = Number(row[col.from]), to = Number(row[col.to]);
    if(!row[col.from] && row[col.from]!==0) return 0;
    if(!row[col.to] && row[col.to]!==0) return 0;
    if(isNaN(from)||isNaN(to)||to<from) return 0;
    return (to-from+1)*col.price;
  }
  if(col.type==="rifa-income"){
    const precioNum = Number(String(row[col.precio]||"0").replace("€",""));
    const tiras = Number(row[col.tiras]||0);
    return precioNum*tiras*10;
  }
  if(col.type==="iva-total"){
    const base = Number(row[col.base]||0);
    const rate = IVA_RATES[row[col.iva]] ?? 0;
    return base*(1+rate);
  }
  if(col.type==="total-taquilla"){
    return col.sum.reduce((s,k)=>{
      const srcCol = mod.columns.find(c=>c.key===k);
      return s + (srcCol ? computedValue(mod,row,srcCol) : Number(row[k]||0));
    },0);
  }
  return Number(row[col.key]||0);
}
function isComputedType(t){ return t==="computed-diff"||t==="range-income"||t==="rifa-income"||t==="iva-total"||t==="total-taquilla"; }

/* ---- quick validation: warns (does not block) when a new/edited value looks wrong ---- */
function validateField(col, val){
  if(col.required && (val===""||val===null||val===undefined)) return `"${col.label}" no puede quedar vacío.`;
  if((col.type==="currency"||col.type==="number") && val!=="" && val!==null && !isNaN(val) && Number(val)<0) return `"${col.label}" no puede ser un número negativo.`;
  if(col.key==="cuota" && val!=="" && Number(val)>100) return `Revisa la cuota: son ${Number(val)} €, ¿es correcto? (las cuotas suelen ir de 0 a 100 €).`;
  return null;
}
function checkRange(row, fromKey, toKey, label){
  const from = row[fromKey], to = row[toKey];
  if(from!==""&&from!==undefined&&to!==""&&to!==undefined && Number(to) < Number(from)){
    toast(`⚠️ ${label}: el número "hasta" no puede ser menor que "desde".`);
  }
}

/* ============ TOAST ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}

window.addEventListener("error", (e)=>{
  console.error("Error no controlado:", e.error || e.message);
  try{ toast("⚠️ Ha ocurrido un error: " + (e.message||"revisa la consola (F12)")); }catch(_){}
});
window.addEventListener("unhandledrejection", (e)=>{
  console.error("Promesa rechazada:", e.reason);
  try{ toast("⚠️ Ha ocurrido un error: " + (e.reason && e.reason.message || e.reason || "revisa la consola (F12)")); }catch(_){}
});

/* ============ FORMAT HELPERS ============ */
const fmtEUR = n => (Number(n)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---- nombre completo de un socio (nombre + apellidos), o del jugador de cantera ---- */
function fullSocioName(r){ return [r.nombre,r.apellidos].filter(Boolean).join(" ").trim() || "Este socio"; }
function rowDisplayName(mod, row){
  if(mod.id==="socios") return fullSocioName(row);
  return row.jugador || "—";
}

/* ---- modal: preguntar la forma de pago al marcar un socio como PAGADO (control de cobros) ---- */
function openFormaPagoModal(currentVal, onConfirm, onCancel){
  const formaPagoCol = {key:"formaPago", label:"Forma de pago", type:"combo", options:["Efectivo","Transferencia","Cheque","Bizum","Domiciliación"]};
  const optList = getOptionsList("socios", formaPagoCol);
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>💰 ¿Cómo ha pagado?</h3>
      <p class="footer-note" style="margin:0 0 12px;">Elige la forma de pago para llevar el control de cómo se ha cobrado la cuota.</p>
      <select id="formaPagoModalSelect">
        ${optList.map(o=>`<option ${o===currentVal?"selected":""}>${escapeHtml(o)}</option>`).join("")}
      </select>
      <div class="modal-actions">
        <button class="btn" id="formaPagoCancel">Cancelar</button>
        <button class="btn btn-primary" id="formaPagoOk">Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector("#formaPagoCancel").onclick = ()=>{ close(); if(onCancel) onCancel(); };
  overlay.onclick = (e)=>{ if(e.target===overlay){ close(); if(onCancel) onCancel(); } };
  overlay.querySelector("#formaPagoOk").onclick = ()=>{
    const v = overlay.querySelector("#formaPagoModalSelect").value;
    close();
    onConfirm(v);
  };
}

/* ============ GENERIC TABLE MODULE ============ */
let searchTerm = {};

function filterableCols(mod){ return mod.columns.filter(c=> c.type==="select"); }

function renderModulePage(mod, extTabs){
  const content = document.getElementById("content");
  const rows = DATA[mod.id];
  searchTerm[mod.id] = searchTerm[mod.id] || "";
  filters[mod.id] = filters[mod.id] || {};

  const hasSubtabs = (mod.id==="socios" || mod.id==="inferiores");
  if(hasSubtabs) subView[mod.id] = subView[mod.id] || "listado";
  let tabDefs = [];
  if(mod.id==="socios"){
    tabDefs = [
      {v:"listado", label:"📋 Listado"},
      {v:"empresas", label:"🏢 Empresas"},
      {v:"honor", label:"🎖️ Honor"},
      {v:"cuotas", label:"🗓️ Cuotas mensuales"},
    ];
  } else if(mod.id==="inferiores"){
    tabDefs = [
      {v:"listado", label:"📋 Listado"},
      {v:"cuotas", label:"🗓️ Cuotas mensuales"},
    ];
  }
  const tabsHtml = extTabs
    ? `<div class="subtabs">${extTabs.tabDefs.map(t=>`<button class="subtab-btn ${extTabs.activeView===t.v?"active":""}" data-view="${t.v}">${t.label}</button>`).join("")}</div>`
    : (hasSubtabs ? `<div class="subtabs">${tabDefs.map(t=>`<button class="subtab-btn ${subView[mod.id]===t.v?"active":""}" data-view="${t.v}">${t.label}</button>`).join("")}</div>` : "");

  if(hasSubtabs && subView[mod.id]==="cuotas"){
    content.innerHTML = tabsHtml + `<div id="cuotasGridWrap"></div>`;
    content.querySelectorAll(".subtab-btn").forEach(b=>{ b.onclick=()=>{ subView[mod.id]=b.dataset.view; renderModulePage(mod); }; });
    renderCuotasGrid(mod);
    return;
  }

  const filterCols = filterableCols(mod);
  const filterHtml = filterCols.map(c=>{
    const opts = getOptionsList(mod.id,c);
    const current = filters[mod.id][c.key] || "";
    return `<select class="filter-select" data-filtercol="${c.key}"><option value="">${escapeHtml(c.label)}: todos</option>${opts.map(o=>`<option value="${escapeHtml(o)}" ${o===current?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select>`;
  }).join("");
  const anyFilterActive = Object.values(filters[mod.id]).some(v=>v) || !!searchTerm[mod.id];

  const showCuentasPanel = (mod.id==="contabilidad" || mod.id==="traspasos");
  content.innerHTML = `
    ${tabsHtml}
    ${showCuentasPanel ? '<div id="cuentasPanelWrap"></div>' : ""}
    ${mod.id==="socios" ? '<div id="freedNumbersWrap"></div>' : ""}
    <div class="toolbar">
      <div class="left-tools">
        <div class="search-box"><input type="text" placeholder="Buscar en ${mod.label.toLowerCase()}..." id="searchInput" value="${escapeHtml(searchTerm[mod.id])}"></div>
        ${filterHtml}
        ${anyFilterActive ? '<button class="btn" id="clearFiltersBtn">✕ Quitar filtros</button>' : ""}
        <button class="btn" id="selectAllBtn">☑️ Marcar todos</button>
        <button class="btn btn-danger" id="deleteSelBtn">🗑️ Eliminar selección</button>
      </div>
      <div class="right-tools">
        ${mod.id==="socios" ? '<button class="btn btn-dark" id="renovarBtn">🔄 Renovar temporada</button>' : ""}
        <button class="btn" id="importBtn">📥 Importar Excel</button>
        <input type="file" id="importFile" class="file-hidden" accept=".xlsx,.xls,.csv">
        <button class="btn" id="exportBtn">📤 Exportar Excel</button>
        <button class="btn btn-dark" id="printBtn">🖨️ Imprimir</button>
        <button class="btn btn-primary" id="addRowBtn">➕ Añadir fila</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
    <div class="footer-note">${getFilteredRows(mod).length} de ${scopedRows(mod).length} registro(s) · ✏️ Haz clic en cualquier celda para editarla — los cambios se guardan solos en este navegador.</div>
  `;

  if(extTabs){ content.querySelectorAll(".subtab-btn").forEach(b=>{ b.onclick=()=> extTabs.onTabClick(b.dataset.view); }); }
  else if(hasSubtabs){ content.querySelectorAll(".subtab-btn").forEach(b=>{ b.onclick=()=>{ subView[mod.id]=b.dataset.view; renderModulePage(mod); }; }); }
  if(showCuentasPanel) updateCuentasPanel();
  if(mod.id==="socios"){ updateFreedNumbersPanel(); document.getElementById("renovarBtn").onclick = ()=> renovarTemporadaSocios(mod); }
  drawTable(mod);

  document.getElementById("searchInput").oninput = (e)=>{ searchTerm[mod.id] = e.target.value; drawTable(mod); };
  content.querySelectorAll(".filter-select").forEach(sel=>{
    sel.onchange = ()=>{ filters[mod.id][sel.dataset.filtercol] = sel.value; renderModulePage(mod, extTabs); };
  });
  const clearBtn = document.getElementById("clearFiltersBtn");
  if(clearBtn) clearBtn.onclick = ()=>{ filters[mod.id] = {}; searchTerm[mod.id] = ""; renderModulePage(mod, extTabs); };
  document.getElementById("addRowBtn").onclick = ()=>{
    try{
      const blank = {}; mod.columns.forEach(c=>{ if(!isComputedType(c.type)) blank[c.key] = (c.default!==undefined) ? c.default : ((c.type==="select"||c.type==="combo") ? getOptionsList(mod.id,c)[0] : ""); });
      blank.__id = genId();
      if(mod.id==="socios"){
        if(subView[mod.id]==="empresas") blank.categoria = "Empresa";
        else if(subView[mod.id]==="honor") blank.categoria = "Honor";
      }
      rows.unshift(blank); saveData(mod.id, rows); drawTable(mod); if(showCuentasPanel) updateCuentasPanel(); if(mod.id==="socios") updateFreedNumbersPanel(); toast("Fila añadida");
    }catch(err){
      console.error("Error al añadir fila:", err);
      toast("⚠️ No se pudo añadir la fila: " + err.message);
    }
  };
  document.getElementById("selectAllBtn").onclick = ()=>{
    const boxes = document.querySelectorAll(".row-check");
    const allChecked = [...boxes].every(b=>b.checked);
    boxes.forEach(b=>{ b.checked = !allChecked; b.closest("tr").classList.toggle("selected", b.checked); });
  };
  document.getElementById("deleteSelBtn").onclick = ()=>{
    const boxes = [...document.querySelectorAll(".row-check")];
    const toDelete = boxes.filter(b=>b.checked).map(b=>Number(b.dataset.idx));
    if(!toDelete.length){ toast("No hay filas marcadas"); return; }
    if(!window.confirm(`¿Seguro que quieres eliminar ${toDelete.length} fila(s)? Esta acción no se puede deshacer.`)) return;
    const visibleRows = getFilteredRows(mod);
    const idsToRemove = new Set(toDelete.map(i=> visibleRows[i]));
    DATA[mod.id] = rows.filter(r=> !idsToRemove.has(r));
    saveData(mod.id, DATA[mod.id]);
    drawTable(mod);
    if(showCuentasPanel) updateCuentasPanel();
    if(mod.id==="socios") updateFreedNumbersPanel();
    toast(idsToRemove.size+" fila(s) eliminada(s)");
  };
  document.getElementById("exportBtn").onclick = ()=> exportExcel(mod);
  document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e)=> importExcel(mod, e.target.files[0], showCuentasPanel);
  document.getElementById("printBtn").onclick = ()=> printFullscreen(mod.title);
}

/* ============ TAQUILLA — vertical "one jornada per card" layout ============ */
function rangeRowHtml(mod,row,i,label,fromKey,toKey,incomeKey){
  return `<div class="range-row">
     <span class="rr-label">${label}</span>
     <label>Nº desde<input type="number" data-field="${fromKey}" data-idx="${i}" value="${row[fromKey]??""}"></label>
     <label>Nº hasta<input type="number" data-field="${toKey}" data-idx="${i}" value="${row[toKey]??""}"></label>
     <span class="rr-sub" data-total="${incomeKey}">${fmtEUR(computedValue(mod,row,mod.columns.find(c=>c.key===incomeKey)))}</span>
   </div>`;
}
function rifaRowHtml(mod,row,i,label,precioKey,tirasKey,incomeKey){
  const col = mod.columns.find(c=>c.key===precioKey);
  const optList = getOptionsList(mod.id,col);
  if(row[precioKey] && !optList.includes(row[precioKey])) optList.push(row[precioKey]);
  const opts = optList.map(o=>`<option ${o===row[precioKey]?"selected":""}>${o}</option>`).join("");
  return `<div class="range-row">
    <span class="rr-label">${label}</span>
    <label>Precio/número<select data-field="${precioKey}" data-idx="${i}">${opts}</select></label>
    <label>Tiras vendidas (10 núm.)<input type="number" data-field="${tirasKey}" data-idx="${i}" value="${row[tirasKey]??""}"></label>
    <span class="rr-sub" data-total="${incomeKey}">${fmtEUR(computedValue(mod,row,mod.columns.find(c=>c.key===incomeKey)))}</span>
  </div>`;
}
function jornadaCardHtml(mod,row,i){
  return `<div class="jornada-card" data-jidx="${i}">
    <div class="jornada-head">
      <label>Fecha<input type="date" data-field="fecha" data-idx="${i}" value="${row.fecha||""}"></label>
      <label>Partido<input type="text" data-field="partido" data-idx="${i}" value="${escapeHtml(row.partido||"")}" placeholder="Rival" style="min-width:220px;"></label>
      <label>Resultado<input type="text" data-field="resultado" data-idx="${i}" value="${escapeHtml(row.resultado||"")}" placeholder="0-0" style="min-width:70px;"></label>
      <button class="icon-btn delete-jornada" data-idx="${i}" title="Eliminar jornada">✖ Eliminar jornada</button>
    </div>
    <div class="jornada-section">
      <h4>Entrada anticipada · 5 €</h4>
      ${rangeRowHtml(mod,row,i,"Anticipada",'antDesde','antHasta','antIngreso')}
    </div>
    <div class="jornada-section">
      <h4>Entradas taquilla</h4>
      ${rangeRowHtml(mod,row,i,"Entrada A · 10 €",'aDesde','aHasta','aIngreso')}
      ${rangeRowHtml(mod,row,i,"Entrada B · 10 €",'bDesde','bHasta','bIngreso')}
      ${rangeRowHtml(mod,row,i,"Entrada C · 5 €",'cDesde','cHasta','cIngreso')}
      ${rangeRowHtml(mod,row,i,"Entrada D · 5 €",'dDesde','dHasta','dIngreso')}
    </div>
    <div class="jornada-section">
      <h4>Rifa</h4>
      ${rifaRowHtml(mod,row,i,"Rifa 1",'rifa1Precio','rifa1Tiras','rifa1Ingreso')}
      ${rifaRowHtml(mod,row,i,"Rifa 2",'rifa2Precio','rifa2Tiras','rifa2Ingreso')}
    </div>
    <div class="jornada-total">
      <span class="tot-label">TOTAL recaudado</span>
      <b data-total="totalDia">${fmtEUR(computedValue(mod,row,mod.columns.find(c=>c.key==="totalDia")))}</b>
    </div>
  </div>`;
}
function recomputeJornadaCard(mod,row,cardEl){
  mod.columns.forEach(c=>{
    if(isComputedType(c.type)){
      const span = cardEl.querySelector(`[data-total="${c.key}"]`);
      if(span) span.textContent = fmtEUR(computedValue(mod,row,c));
    }
  });
}
function buildJornadasWrap(mod){
  const wrap = document.getElementById("jornadasWrap");
  const rows = DATA.taquillas;
  if(!rows.length){
    wrap.innerHTML = `<div class="empty-state"><div class="e-ic">🎟️</div>Sin jornadas registradas. Usa “Añadir jornada” para empezar.</div>`;
    return;
  }
  wrap.innerHTML = rows.map((r,i)=> jornadaCardHtml(mod,r,i)).join("");
  wrap.querySelectorAll("[data-field]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const i = Number(inp.dataset.idx);
      const key = inp.dataset.field;
      const row = DATA.taquillas[i];
      const col = mod.columns.find(c=>c.key===key);
      let val = inp.value;
      if(col && col.type==="number") val = val===""? "" : Number(val);
      row[key] = val;
      const warn = col ? validateField(col, val) : null;
      if(warn) toast("⚠️ "+warn);
      if(key==="antHasta"||key==="antDesde") checkRange(row,"antDesde","antHasta","Entrada anticipada");
      if(key==="aHasta"||key==="aDesde") checkRange(row,"aDesde","aHasta","Entrada A");
      if(key==="bHasta"||key==="bDesde") checkRange(row,"bDesde","bHasta","Entrada B");
      if(key==="cHasta"||key==="cDesde") checkRange(row,"cDesde","cHasta","Entrada C");
      if(key==="dHasta"||key==="dDesde") checkRange(row,"dDesde","dHasta","Entrada D");
      saveData("taquillas", DATA.taquillas);
      recomputeJornadaCard(mod, row, inp.closest(".jornada-card"));
    });
    if(inp.tagName==="INPUT" && inp.type!=="date"){
      inp.addEventListener("input", debounce(()=>{
        const i = Number(inp.dataset.idx);
        const key = inp.dataset.field;
        const row = DATA.taquillas[i];
        const col = mod.columns.find(c=>c.key===key);
        let val = inp.value;
        if(col && col.type==="number") val = val===""? "" : Number(val);
        row[key] = val;
        saveData("taquillas", DATA.taquillas);
        recomputeJornadaCard(mod, row, inp.closest(".jornada-card"));
      }, 500));
    }
  });
  wrap.querySelectorAll(".delete-jornada").forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.idx);
      const r = DATA.taquillas[i];
      const label = r.partido ? `"${r.partido}"` : "esta jornada";
      if(!window.confirm(`¿Seguro que quieres eliminar ${label}? Esta acción no se puede deshacer.`)) return;
      DATA.taquillas.splice(i,1);
      saveData("taquillas", DATA.taquillas);
      buildJornadasWrap(mod);
      toast("Jornada eliminada");
    };
  });
}

/* ============ CUOTAS MENSUALES — quién ha pagado cada mes (socios / cantera) ============ */
function renderCuotasGrid(mod){
  const wrap = document.getElementById("cuotasGridWrap");
  ensureRowIds(mod);
  const year = cuotasYearState;
  const data = loadCuotasMensuales(mod.id);
  const rows = mod.id==="socios" ? DATA.socios.filter(r=> r.categoria!=="Empresa" && r.categoria!=="Honor") : DATA[mod.id];
  const feeKey = "cuota";
  const personLabel = mod.id==="socios" ? "socio/a" : "jugador/a";

  if(!rows.length){
    wrap.innerHTML = `<div class="empty-state"><div class="e-ic">🗓️</div>Todavía no hay ${mod.id==="socios"?"socios":"jugadores/as"} en el listado.</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="cuotas-toolbar">
      <button class="btn" id="yearPrev">◀</button>
      <span class="cuotas-year">${year}</span>
      <button class="btn" id="yearNext">▶</button>
      <span class="footer-note" style="margin:0 0 0 4px;">Marca el mes en el que cada ${personLabel} ha pagado su cuota — así no hace falta crear un movimiento en Contabilidad por cada persona, solo uno con el total cobrado ese mes.</span>
      <button class="btn btn-dark" id="printCuotasBtn" style="margin-left:auto;">🖨️ Imprimir</button>
    </div>
    <div class="table-wrap">
      <table class="cuotas-table">
        <thead><tr><th style="text-align:left;">${mod.id==="socios"?"Socio/a":"Jugador/a"}</th><th>Cuota</th>${MESES.map(m=>`<th>${m}</th>`).join("")}<th>Pagados</th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const rd = data[r.__id] || {};
            let paidCount = 0;
            const cells = MESES.map((m,mi)=>{
              const k = monthKey(year, mi+1);
              const paid = !!rd[k];
              if(paid) paidCount++;
              return `<td class="cuota-cell"><input type="checkbox" class="cuota-check" data-id="${r.__id}" data-month="${k}" ${paid?"checked":""} title="${m} ${year}"></td>`;
            }).join("");
            return `<tr><td style="text-align:left;font-weight:600;">${escapeHtml(rowDisplayName(mod,r))}</td><td>${fmtEUR(r[feeKey]||0)}</td>${cells}<td style="font-weight:700;">${paidCount}/12</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
    <div class="footer-note">${rows.length} ${mod.id==="socios"?"socio(s)":"jugador(es)"} · ✏️ Marca o desmarca cada casilla — se guarda solo.</div>
  `;
  wrap.querySelectorAll(".cuota-check").forEach(cb=>{
    cb.onchange = ()=>{
      const d = loadCuotasMensuales(mod.id);
      const id = cb.dataset.id, mk = cb.dataset.month;
      d[id] = d[id] || {};
      d[id][mk] = cb.checked;
      saveCuotasMensuales(mod.id, d);
      renderCuotasGrid(mod);
    };
  });
  document.getElementById("yearPrev").onclick = ()=>{ cuotasYearState--; renderCuotasGrid(mod); };
  document.getElementById("yearNext").onclick = ()=>{ cuotasYearState++; renderCuotasGrid(mod); };
  document.getElementById("printCuotasBtn").onclick = ()=> printFullscreen(mod.title+" - Cuotas mensuales");
}

function scopedRows(mod){
  if(mod.id!=="socios") return DATA[mod.id];
  const v = subView[mod.id] || "listado";
  const all = DATA.socios;
  if(v==="empresas") return all.filter(r=> r.categoria==="Empresa");
  if(v==="honor") return all.filter(r=> r.categoria==="Honor");
  if(v==="listado") return all.filter(r=> r.categoria!=="Empresa" && r.categoria!=="Honor");
  return all;
}
function getFilteredRows(mod){
  const term = (searchTerm[mod.id]||"").toLowerCase().trim();
  let rows = scopedRows(mod);
  const f = filters[mod.id] || {};
  Object.keys(f).forEach(k=>{
    if(f[k]) rows = rows.filter(r=> String(r[k]||"")===f[k]);
  });
  if(!term) return rows;
  return rows.filter(r=> mod.columns.some(c=> String(r[c.key]??"").toLowerCase().includes(term)));
}

function drawTable(mod){
  const wrap = document.getElementById("tableWrap");
  const rows = getFilteredRows(mod);
  if(!rows.length){
    wrap.innerHTML = `<div class="empty-state"><div class="e-ic">🗂️</div>Sin registros. Usa “Añadir fila” o “Importar Excel” para empezar.</div>`;
    return;
  }
  let thead = `<tr><th class="chk-col"></th>${mod.columns.map(c=>`<th>${c.label}</th>`).join("")}<th></th></tr>`;
  let tbody = rows.map((r, i)=>{
    const cells = mod.columns.map(c=> cellHtml(mod, r, c, i)).join("");
    return `<tr data-ridx="${i}">
      <td><input type="checkbox" class="row-check" data-idx="${i}"></td>
      ${cells}
      <td class="row-actions actions-col"><button class="icon-btn delete-row" data-idx="${i}" title="Eliminar fila">✖</button></td>
    </tr>`;
  }).join("");

  let tfoot = "";
  if(mod.id==="contabilidad"){
    const ingresos = rows.filter(r=>r.tipo==="Ingreso").reduce((s,r)=>s+Number(r.importe||0),0);
    const gastos = rows.filter(r=>r.tipo==="Gasto").reduce((s,r)=>s+Number(r.importe||0),0);
    const idx = mod.columns.findIndex(c=>c.key==="importe");
    const after = mod.columns.length - idx - 1 + 1; // remaining data cols + action col
    tfoot = `<tr><td colspan="${idx+1}" style="text-align:right;">Balance (ingresos − gastos):</td><td class="${(ingresos-gastos)>=0?'diff-pos':'diff-neg'}">${fmtEUR(ingresos-gastos)}</td>${'<td></td>'.repeat(after)}</tr>`;
  } else if(mod.id==="presupuestos"){
    const p = rows.reduce((s,r)=>s+Number(r.presupuestado||0),0);
    const g = rows.reduce((s,r)=>s+Number(r.gastado||0),0);
    tfoot = `<tr><td colspan="3" style="text-align:right;">Totales:</td><td>${fmtEUR(p)}</td><td>${fmtEUR(g)}</td><td class="${(p-g)>=0?'diff-pos':'diff-neg'}">${fmtEUR(p-g)}</td><td></td></tr>`;
  } else if(mod.id==="taquillas"){
    const total = rows.reduce((s,r)=> s+computedValue(mod,r,mod.columns.find(c=>c.key==="totalDia")),0);
    tfoot = `<tr><td colspan="${mod.columns.length}" style="text-align:right;">TOTAL recaudado (jornadas mostradas):</td><td>${fmtEUR(total)}</td><td></td></tr>`;
  }

  wrap.innerHTML = `<table class="${mod.id==="socios"?"table-upper":""}"><thead>${thead}</thead><tbody>${tbody}</tbody>${tfoot?`<tfoot>${tfoot}</tfoot>`:""}</table>`;

  wrap.querySelectorAll(".row-check").forEach(cb=>{
    cb.onchange = ()=> cb.closest("tr").classList.toggle("selected", cb.checked);
  });
  wrap.querySelectorAll(".delete-row").forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.idx);
      const target = rows[i];
      if(!window.confirm("¿Seguro que quieres eliminar esta fila? Esta acción no se puede deshacer.")) return;
      DATA[mod.id] = DATA[mod.id].filter(r=> r!==target);
      saveData(mod.id, DATA[mod.id]);
      drawTable(mod);
      if(mod.id==="contabilidad" || mod.id==="traspasos") updateCuentasPanel();
      if(mod.id==="socios") updateFreedNumbersPanel();
      toast("Fila eliminada");
    };
  });
  const needsRecalc = mod.columns.some(c=> isComputedType(c.type));
  wrap.querySelectorAll("[data-field]").forEach(inp=>{
    const handler = ()=>{
      const i = Number(inp.dataset.idx);
      const key = inp.dataset.field;
      const rowRef = rows[i];
      const col = mod.columns.find(c=>c.key===key);
      let val = inp.value;
      if(col && col.type==="combo" && val==="__new__"){
        const nv = window.prompt(`Nueva opción para "${col.label}":`, "");
        if(nv && nv.trim()){ val = nv.trim(); addOption(mod.id, col, val); }
        else { val = rowRef[key] || ""; }
      }
      if(inp.dataset.numeric) val = val===""? "" : Number(val);
      rowRef[key] = val;
      if(col && col.type==="combo") addOption(mod.id, col, val);
      if(mod.id==="contabilidad" && key==="tipo"){
        /* la categoría se limita a las cuentas de Ingresos o de Gastos según lo que se elija aquí */
        const catCol = mod.columns.find(c=>c.key==="categoria");
        if(catCol && catCol.optionsByTipo){
          const newList = getOptionsList(mod.id, catCol, val);
          if(!newList.includes(rowRef.categoria)) rowRef.categoria = newList[0] || "";
        }
      }
      const warn = col ? validateField(col, val) : null;
      if(warn) toast("⚠️ "+warn);
      saveData(mod.id, DATA[mod.id]);
      if(mod.id==="contabilidad" || mod.id==="traspasos") updateCuentasPanel();
      if(mod.id==="socios") updateFreedNumbersPanel();
      if(needsRecalc || mod.id==="presupuestos" || mod.id==="contabilidad" || (col && col.type==="combo")){
        drawTable(mod);
      }
    };
    inp.addEventListener("change", handler);
    if(inp.tagName==="INPUT" && inp.type!=="date"){
      inp.addEventListener("input", debounce(()=>{
        const i = Number(inp.dataset.idx);
        const rowRef = rows[i];
        let val = inp.value;
        if(inp.dataset.numeric) val = val===""? "" : Number(val);
        rowRef[inp.dataset.field] = val;
        saveData(mod.id, DATA[mod.id]);
        if(mod.id==="contabilidad" || mod.id==="traspasos") updateCuentasPanel();
      }, 500));
    }
  });

  /* estado de pago (socios): al marcar "Pagado" se pregunta la forma de pago, para llevar el control de cómo ha pagado cada socio */
  wrap.querySelectorAll(".estado-select").forEach(sel=>{
    sel.onchange = ()=>{
      const i = Number(sel.dataset.idx);
      const rowRef = rows[i];
      const prevVal = rowRef.estado;
      const newVal = sel.value;
      if(newVal==="Pagado" && prevVal!=="Pagado"){
        openFormaPagoModal(rowRef.formaPago, (forma)=>{
          rowRef.estado = "Pagado";
          rowRef.formaPago = forma;
          saveData(mod.id, DATA.socios);
          updateFreedNumbersPanel();
          drawTable(mod);
          toast(`✅ ${fullSocioName(rowRef)} — PAGADO (${forma})`);
        }, ()=>{ drawTable(mod); });
      } else {
        rowRef.estado = newVal;
        saveData(mod.id, DATA.socios);
        updateFreedNumbersPanel();
        drawTable(mod);
        toast("Estado de pago actualizado");
      }
    };
  });
  wrap.querySelectorAll(".pay-info-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.idx);
      const rowRef = rows[i];
      openFormaPagoModal(rowRef.formaPago, (forma)=>{
        rowRef.formaPago = forma;
        saveData(mod.id, DATA.socios);
        drawTable(mod);
        toast(`Forma de pago actualizada: ${forma}`);
      });
    };
  });
}

function cellHtml(mod, row, col, idx){
  const val = row[col.key] ?? "";
  if(isComputedType(col.type)){
    const num = computedValue(mod, row, col);
    const cls = (col.type==="computed-diff") ? (num>=0?'diff-pos':'diff-neg') : (col.type==="total-taquilla" ? "diff-pos" : "");
    return `<td class="${cls}" style="font-weight:700;white-space:nowrap;">${fmtEUR(num)}</td>`;
  }
  if(mod.id==="socios" && col.key==="estado"){
    const optList = getOptionsList(mod.id,col);
    if(val && !optList.includes(val)) optList.push(val);
    const opts = optList.map(o=>`<option ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("");
    const payBtn = (val==="Pagado") ? `<button type="button" class="pay-info-btn" data-idx="${idx}" title="${row.formaPago? "Forma de pago: "+row.formaPago : "Sin forma de pago registrada — clic para añadirla"}">💳</button>` : "";
    return `<td><div class="estado-cell"><select class="cell-select estado-select" data-idx="${idx}">${opts}</select>${payBtn}</div></td>`;
  }
  if(col.type==="select"){
    const tipo = col.optionsByTipo ? (row.tipo || "Ingreso") : undefined;
    const optList = getOptionsList(mod.id,col,tipo);
    if(val && !optList.includes(val)) optList.push(val);
    const opts = optList.map(o=>`<option ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("");
    return `<td><select class="cell-select" data-field="${col.key}" data-idx="${idx}">${opts}</select></td>`;
  }
  if(col.type==="combo"){
    const optList = getOptionsList(mod.id,col);
    if(val && !optList.includes(val)) optList.push(val);
    const opts = optList.map(o=>`<option ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("");
    return `<td><select class="cell-select" data-field="${col.key}" data-idx="${idx}" data-combo="1">${opts}<option value="__new__">➕ Añadir nueva...</option></select></td>`;
  }
  if(col.type==="date"){
    return `<td><input class="cell-input" type="date" data-field="${col.key}" data-idx="${idx}" value="${escapeHtml(val)}"></td>`;
  }
  if(col.type==="currency"){
    const minmax = (col.min!==undefined?` min="${col.min}"`:"") + (col.max!==undefined?` max="${col.max}"`:"");
    return `<td><input class="cell-input num" type="number" step="0.01"${minmax} data-numeric="1" data-field="${col.key}" data-idx="${idx}" value="${val===""?"":val}"></td>`;
  }
  if(col.type==="number"){
    return `<td><input class="cell-input num" type="number" step="1" data-numeric="1" data-field="${col.key}" data-idx="${idx}" value="${val===""?"":val}"></td>`;
  }
  return `<td><input class="cell-input" type="text" data-field="${col.key}" data-idx="${idx}" value="${escapeHtml(val)}"></td>`;
}

/* ============ IMPORT / EXPORT EXCEL ============ */
function exportExcel(mod){
  const rows = DATA[mod.id];
  const upper = mod.id==="socios";
  const data = rows.map(r=>{
    const o = {};
    mod.columns.forEach(c=>{
      const label = upper ? c.label.toUpperCase() : c.label;
      if(isComputedType(c.type)) o[label] = computedValue(mod, r, c);
      else{
        let v = r[c.key];
        if(upper && typeof v==="string") v = v.toUpperCase();
        o[label] = v;
      }
    });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, mod.label.slice(0,31));
  XLSX.writeFile(wb, `CD_Cayon_${mod.id}.xlsx`);
  toast("Excel exportado");
}

/* Quita acentos, espacios, símbolos y pasa a minúsculas para poder comparar
   cabeceras/valores aunque no coincidan al 100% (mayúsculas, acentos, "de", etc.) */
function normKey(k){ return String(k==null?"":k).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,""); }

/* Alias conocidos de cabecera -> key interna de cada columna, por si el Excel
   no usa exactamente el label que muestra la app */
const IMPORT_HEADER_ALIASES = {
  numero: ["numero","nsocio","nºsocio","n°socio","nodesocio","nºdesocio","n°desocio","numsocio","numerosocio","id"],
  nombre: ["nombre","nombres"],
  apellidos: ["apellidos","apellido"],
  dni: ["dni","nif","documento"],
  categoria: ["categoria","tiposocio","categoría","tipo"],
  cuota: ["cuota","cuotaanual","cuotasocio","importecuota","cuotaanualeuros"],
  estado: ["estado","estadopago","estadodepago"],
  temporada: ["temporada"],
};

function buildImportKeyMap(mod, sampleRowKeys){
  const map = {}; // header original -> column key
  const byNormLabel = {};
  mod.columns.forEach(c=> byNormLabel[normKey(c.label)] = c.key);
  const byAlias = {};
  Object.keys(IMPORT_HEADER_ALIASES).forEach(colKey=>{
    IMPORT_HEADER_ALIASES[colKey].forEach(alias=> byAlias[alias] = colKey);
  });
  sampleRowKeys.forEach(header=>{
    const n = normKey(header);
    map[header] = byNormLabel[n] || byAlias[n] || header;
  });
  return map;
}

/* Normaliza el VALOR de una celda de tipo "select" para que encaje con las
   opciones reales de la columna, aunque venga en mayúsculas, sin acentos,
   o con texto ligeramente distinto (p.ej. "SOCIO DE HONOR" -> "Honor") */
const IMPORT_VALUE_ALIASES = {
  // categoría de socio
  sociodehonor: "Honor", honor: "Honor",
  adulto: "Adulto", jubilado: "Jubilado", joven: "Joven", juvenil: "Juvenil",
  baby: "Baby", empresa: "Empresa", obsequio: "Obsequio", simpatizante: "Simpatizante",
  // estado de pago
  pagado: "Pagado", aldia: "Pagado", aldía: "Pagado", cobrado: "Pagado",
  pendiente: "Pendiente", noPagado: "Pendiente", impagado: "Pendiente",
};
function normalizeSelectValue(col, rawVal, tipoGuess){
  if(rawVal==null || rawVal==="") return rawVal;
  const n = normKey(rawVal);
  if(IMPORT_VALUE_ALIASES[n]) return IMPORT_VALUE_ALIASES[n];
  // ¿coincide (ignorando acentos/mayúsculas) con alguna opción real de la columna?
  const opts = getOptionsList(col._modId, col, col.optionsByTipo ? tipoGuess : undefined);
  const hit = opts.find(o=> normKey(o)===n);
  return hit || rawVal;
}

function importExcel(mod, file, alsoRefreshCuentas){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:""});
      if(!json.length){ toast("El archivo no tiene filas de datos"); return; }
      const keyMap = buildImportKeyMap(mod, Object.keys(json[0]));
      const mapped = json.map(row=>{
        const o = {};
        // para columnas con optionsByTipo (categoria en contabilidad) hace falta saber el
        // "tipo" (Ingreso/Gasto) de la fila ANTES de normalizar la categoría, para usar la lista correcta
        let rowTipoGuess;
        Object.keys(row).forEach(k=>{ if((keyMap[k]||k)==="tipo") rowTipoGuess = normKey(row[k])==="gasto" ? "Gasto" : "Ingreso"; });
        Object.keys(row).forEach(k=>{
          const key = keyMap[k] || k;
          const col = mod.columns.find(c=> c.key===key);
          let val = row[k];
          if(col && col.type==="select"){ col._modId = mod.id; val = normalizeSelectValue(col, val, rowTipoGuess); }
          o[key] = val;
        });
        return o;
      });
      DATA[mod.id] = mapped.concat(DATA[mod.id]);
      saveData(mod.id, DATA[mod.id]);
      if(mod.id==="taquillas"){ buildJornadasWrap(mod); }
      else { drawTable(mod); if(alsoRefreshCuentas) updateCuentasPanel(); if(mod.id==="socios") updateFreedNumbersPanel(); }
      toast(mapped.length+" fila(s) importadas");
    }catch(err){
      console.error(err);
      toast("No se pudo leer el archivo");
    }
  };
  reader.readAsArrayBuffer(file);
  document.getElementById("importFile").value = "";
}

/* ============ PRINT ============ */
function printFullscreen(title){
  document.body.classList.add("print-fullscreen");
  const cleanup = ()=> document.body.classList.remove("print-fullscreen");
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{}).finally(()=>{
      window.print();
    });
  } else {
    window.print();
  }
  window.onafterprint = ()=>{
    cleanup();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  };
}

/* ============ AJUSTES — manage cuentas contables & any other list ============ */
function ajustesSections(){
  const sections = [];
  MODULES.forEach(m=>{
    if(!m.columns) return;
    if(m.id==="traspasos") return;
    m.columns.forEach(c=>{
      if(c.type==="select" || c.type==="combo"){
        if(c.optionsByTipo){
          /* una columna por cada tipo (Ingreso / Gasto), cada una con su propia lista de cuentas */
          Object.keys(c.optionsByTipo).forEach(tipo=>{
            const label = tipo==="Ingreso" ? c.label+" (Ingresos)" : tipo==="Gasto" ? c.label+" (Gastos)" : c.label+" ("+tipo+")";
            sections.push({modId:m.id, modLabel:m.label, col:Object.assign({}, c, {label, tipoFixed:tipo}), tipo});
          });
        } else {
          sections.push({modId:m.id, modLabel:m.label, col:c});
        }
      }
    });
  });
  sections.sort((a,b)=>{
    const score = s=> (s.modId==="contabilidad" && s.col.key==="cuenta") ? -1 : 0;
    return score(a)-score(b);
  });
  return sections;
}
function ajusteCardHtml(s){
  const opts = getOptionsList(s.modId, s.col, s.tipo);
  const isMain = s.modId==="contabilidad" && s.col.key==="cuenta";
  const canReset = (s.col.optionsByTipo || s.col.options) && hasCustomOptionsList(s.modId, s.col, s.tipo);
  return `<div class="ajuste-card ${isMain?'ajuste-main':''}">
    <h4>${isMain?"💳 ":""}${s.modLabel} · ${s.col.label}
      ${canReset ? `<button class="btn ajuste-reset-btn" data-mod="${s.modId}" data-col="${s.col.key}" data-tipo="${s.tipo||""}" title="Volver a la lista completa de fábrica para esta categoría" style="font-size:11px;padding:3px 8px;margin-left:8px;">↩️ Restablecer lista</button>` : ""}
    </h4>
    <div class="chip-row">
      ${opts.map(o=>`<span class="chip">${escapeHtml(o)}<button class="chip-del" data-mod="${s.modId}" data-col="${s.col.key}" data-tipo="${s.tipo||""}" data-val="${escapeHtml(o)}" title="Eliminar opción">×</button></span>`).join("")}
    </div>
    <div class="ajuste-add-row">
      <input type="text" class="ajuste-add-input" data-mod="${s.modId}" data-col="${s.col.key}" data-tipo="${s.tipo||""}" placeholder="Añadir opción nueva...">
      <button class="btn btn-primary ajuste-add-btn" data-mod="${s.modId}" data-col="${s.col.key}" data-tipo="${s.tipo||""}">➕ Añadir</button>
    </div>
  </div>`;
}
function findAjusteSection(sections, mod, col, tipo){
  return sections.find(x=> x.modId===mod && x.col.key===col && (x.tipo||"")===(tipo||""));
}
function buildAjustesGrid(sections){
  const grid = document.getElementById("ajustesGrid");
  grid.innerHTML = sections.map(s=> ajusteCardHtml(s)).join("");
  grid.querySelectorAll(".chip-del").forEach(btn=>{
    btn.onclick = ()=>{
      const s = findAjusteSection(sections, btn.dataset.mod, btn.dataset.col, btn.dataset.tipo);
      if(!s) return;
      if(!window.confirm(`¿Eliminar la opción "${btn.dataset.val}" de "${s.modLabel} · ${s.col.label}"? Los registros que ya la tengan la conservarán, pero dejará de estar en la lista.`)) return;
      if(deleteOption(s.modId, s.col, btn.dataset.val, s.tipo)){ buildAjustesGrid(sections); toast("Opción eliminada"); }
    };
  });
  grid.querySelectorAll(".ajuste-reset-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const s = findAjusteSection(sections, btn.dataset.mod, btn.dataset.col, btn.dataset.tipo);
      if(!s) return;
      if(!window.confirm(`¿Restablecer "${s.modLabel} · ${s.col.label}" a la lista completa de fábrica? No afecta a los movimientos ya guardados, solo a las opciones del desplegable.`)) return;
      resetOptionsList(s.modId, s.col, s.tipo);
      buildAjustesGrid(sections);
      toast("Lista restablecida ✓");
    };
  });
  grid.querySelectorAll(".ajuste-add-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const s = findAjusteSection(sections, btn.dataset.mod, btn.dataset.col, btn.dataset.tipo);
      const input = grid.querySelector(`input.ajuste-add-input[data-mod="${btn.dataset.mod}"][data-col="${btn.dataset.col}"][data-tipo="${btn.dataset.tipo}"]`);
      if(s && addOption(s.modId, s.col, input.value, s.tipo)){ buildAjustesGrid(sections); toast("Opción añadida"); }
      else toast("Escribe un valor nuevo distinto");
    };
  });
  grid.querySelectorAll(".ajuste-add-input").forEach(inp=>{
    inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); inp.nextElementSibling.click(); } });
  });
}
function usersCardHtml(){
  const users = settingsStore.users || [];
  return `<div class="ajuste-card ajuste-main">
    <h4>🔑 Usuarios con acceso al ERP</h4>
    <div class="footer-note" style="margin:0 0 10px;">Correo y contraseña que pide la pantalla de entrada. Cualquiera de esta lista puede entrar; se sincroniza igual que el resto de datos.</div>
    <div class="users-list">
      ${users.map((u,i)=>`
        <div class="user-row">
          <input type="email" class="cell-input user-email" data-idx="${i}" value="${escapeHtml(u.email)}" placeholder="correo@ejemplo.com">
          <input type="text" class="cell-input user-pass" data-idx="${i}" value="${escapeHtml(u.password)}" placeholder="contraseña">
          <button class="icon-btn user-del" data-idx="${i}" title="Eliminar usuario">✖</button>
        </div>`).join("")}
    </div>
    <button class="btn btn-primary" id="addUserBtn">➕ Añadir usuario</button>
  </div>`;
}
function updateUsersCard(){
  const wrap = document.getElementById("usersCardWrap");
  if(!wrap) return;
  wrap.innerHTML = usersCardHtml();
  wrap.querySelectorAll(".user-email,.user-pass").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const i = Number(inp.dataset.idx);
      settingsStore.users[i][inp.classList.contains("user-email")?"email":"password"] = inp.value;
      persistSettings();
    });
  });
  wrap.querySelectorAll(".user-del").forEach(btn=>{
    btn.onclick = ()=>{
      if(settingsStore.users.length<=1){ toast("Tiene que quedar al menos un usuario"); return; }
      if(!window.confirm("¿Eliminar este usuario? Ya no podrá entrar con ese correo.")) return;
      settingsStore.users.splice(Number(btn.dataset.idx),1);
      persistSettings();
      updateUsersCard();
    };
  });
  document.getElementById("addUserBtn").onclick = ()=>{
    settingsStore.users.push({email:"", password:""});
    persistSettings();
    updateUsersCard();
  };
}
function renderAjustes(){
  const content = document.getElementById("content");
  const sections = ajustesSections();
  content.innerHTML = `
    <div class="section-desc" style="margin-bottom:16px;max-width:640px;">Añade o quita opciones de cualquier lista desplegable del ERP — por ejemplo una <b>cuenta contable</b> nueva además de Caja, Cuenta Bancaria, Cuenta Federación y Mutualidad. Los cambios se aplican al momento en todos los módulos.</div>
    <div id="usersCardWrap"></div>
    <div class="ajustes-grid" id="ajustesGrid"></div>
  `;
  updateUsersCard();
  buildAjustesGrid(sections);
}

/* ============ TOP ACTIONS (global) ============ */
document.getElementById("topActions").innerHTML = `
  <span id="syncIndicator" class="sync-indicator sync-local">💻 Solo este dispositivo</span>
  <span id="saveIndicator" class="save-indicator">✓ Guardado</span>
  <button class="btn" id="saveAllBtn">💾 Guardar</button>
  <button class="btn btn-dark" id="fullscreenBtn">⛶ Pantalla completa</button>
  <button class="btn" id="logoutBtn">🚪 Salir</button>
`;
document.getElementById("saveAllBtn").onclick = ()=>{
  MODULES.forEach(m=>{ if(m.columns) saveData(m.id, DATA[m.id]); });
  if(dbNS && dbDocs.settings) dbDocs.settings.set(settingsStore).catch(e=>console.warn(e));
  else { try{ localStorage.setItem(STORAGE_PREFIX+"settings", JSON.stringify(settingsStore)); }catch(e){} }
  toast("Todo guardado ✓");
};
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=> toast("El navegador no permitió activar pantalla completa"));
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}
function updateFullscreenBtn(){
  const btn = document.getElementById("fullscreenBtn");
  if(!btn) return;
  btn.innerHTML = document.fullscreenElement ? "⛶ Salir de pantalla completa" : "⛶ Pantalla completa";
}
document.getElementById("fullscreenBtn").onclick = toggleFullscreen;
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.getElementById("logoutBtn").onclick = ()=>{
  if(window.confirm("¿Cerrar sesión en este dispositivo? Tendrás que volver a escribir el correo y la contraseña la próxima vez.")) logout();
};

/* ============ ACCESO (correo + contraseña) ============ */
function authKey(){ return STORAGE_PREFIX+"auth"; }
function buildLoginGateHtml(){
  return `
  <div id="loginGate" class="login-gate">
    <div class="login-card">
      <img id="loginLogo" alt="CD Cayón">
      <h2>CD CAYÓN</h2>
      <p class="login-sub">Introduce tu correo y contraseña para entrar al ERP del club.</p>
      <label>Correo<input type="email" id="loginEmail" autocomplete="username"></label>
      <label>Contraseña<input type="password" id="loginPass" autocomplete="current-password"></label>
      <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">Entrar</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>`;
}
function showLoginGate(){
  document.body.insertAdjacentHTML("afterbegin", buildLoginGateHtml());
  const brandLogo = document.querySelector(".brand img");
  const loginLogo = document.getElementById("loginLogo");
  if(brandLogo && loginLogo) loginLogo.src = brandLogo.src;
  const tryLogin = ()=>{
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const pass = document.getElementById("loginPass").value;
    const match = (settingsStore.users||[]).find(u=> (u.email||"").trim().toLowerCase()===email && u.password===pass);
    if(match){
      try{ localStorage.setItem(authKey(), email); }catch(e){}
      const gate = document.getElementById("loginGate");
      if(gate) gate.remove();
      startApp();
    } else {
      document.getElementById("loginError").textContent = "Correo o contraseña incorrectos.";
    }
  };
  document.getElementById("loginBtn").onclick = tryLogin;
  ["loginEmail","loginPass"].forEach(id=>{
    document.getElementById(id).addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
  });
  document.getElementById("loginEmail").focus();
}
function logout(){
  try{ localStorage.removeItem(authKey()); }catch(e){}
  location.reload();
}
let appStarted = false;
function startApp(){
  if(appStarted) return;
  appStarted = true;
  goTo("dashboard");
}

/* ============ INIT ============ */
function notifyRemoteUpdate(){
  const t = document.getElementById("toast");
  t.innerHTML = `🔄 Hay cambios nuevos de otro dispositivo. <u style="cursor:pointer;" id="refreshNowLink">Actualizar ahora</u>`;
  t.classList.add("show");
  const link = document.getElementById("refreshNowLink");
  if(link) link.onclick = ()=>{ t.classList.remove("show"); goTo(current); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 7000);
}
function isUserTyping(){
  const active = document.activeElement;
  return !!(active && document.getElementById("content").contains(active) && (active.tagName==="INPUT"||active.tagName==="SELECT"));
}
function handleRemoteChange(){
  if(!appStarted) return;
  if(isUserTyping()) notifyRemoteUpdate();
  else goTo(current);
}
async function initStorage(){
  try{
    if(!window.claude || !window.claude.use) return; // preview / no host
    dbNS = await window.claude.use("db");
  }catch(e){ dbNS = null; }
  if(!dbNS) return; // stays on localStorage, indicator already shows "solo este dispositivo"

  try{
    for(const m of MODULES){
      if(!m.columns) continue;
      const ref = dbNS.doc("data/"+m.id);
      dbDocs[m.id] = ref;
      try{
        const snap = await ref.get();
        const body = snap && snap.exists ? snap.data() : undefined;
        if(body && Array.isArray(body.rows)){
          DATA[m.id] = body.rows;
        } else {
          await ref.set({rows: DATA[m.id]});
        }
      }catch(e){ console.warn("db load failed for", m.id, e); }
    }
    ["socios","inferiores"].forEach(id=>{ if(DATA[id]) ensureRowIds({id}); });

    const sref = dbNS.doc("data/settings");
    dbDocs.settings = sref;
    try{
      const snap = await sref.get();
      const body = snap && snap.exists ? snap.data() : undefined;
      if(body){
        Object.assign(settingsStore, body);
      } else {
        await sref.set(settingsStore);
      }
    }catch(e){ console.warn("db settings load failed", e); }

    // now that shared data is in, subscribe to live changes from other devices
    MODULES.forEach(m=>{
      if(!m.columns) return;
      dbDocs[m.id].onSnapshot(snap=>{
        if(!snap || !snap.exists || snap.metadata.hasPendingWrites) return;
        const body = snap.data();
        const incoming = Array.isArray(body && body.rows) ? body.rows : [];
        if(JSON.stringify(incoming)===JSON.stringify(DATA[m.id])) return;
        DATA[m.id] = incoming;
        if(m.id==="socios"||m.id==="inferiores") ensureRowIds(m);
        if(current===m.id || current==="dashboard") handleRemoteChange();
      }, err=> console.warn("db snapshot error", m.id, err));
    });
    dbDocs.settings.onSnapshot(snap=>{
      if(!snap || !snap.exists || snap.metadata.hasPendingWrites) return;
      const body = snap.data();
      if(!body) return;
      if(JSON.stringify(body)===JSON.stringify(settingsStore)) return;
      Object.assign(settingsStore, body);
      handleRemoteChange();
    }, err=> console.warn("db settings snapshot error", err));

    const ind = document.getElementById("syncIndicator");
    if(ind){ ind.textContent = "🔗 Compartido entre dispositivos"; ind.className = "sync-indicator sync-shared"; }
    if(appStarted) goTo(current); // refresh whatever is on screen with the authoritative shared data
  }catch(e){
    console.warn("initStorage failed", e);
  }
}

initStorage(); // start syncing (incl. the users list) in the background right away
let alreadyAuthed = null;
try{ alreadyAuthed = localStorage.getItem(authKey()); }catch(e){}
if(alreadyAuthed){ startApp(); } else { showLoginGate(); }
</script>
